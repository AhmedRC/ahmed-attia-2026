<script>
/* ============================================================
   RC-FEA 2D — solver core v2 (general topology)
   Units: mm, N, MPa.
   Topology: joints -> lines -> rectangular macro-elements with
   assigned concrete materials, meshed on a shared rectilinear
   grid. Axis-aligned bar reinforcement with bond springs.
   Supports and loads on any joints or lines, X/Y direction.
   Concrete: Q4 plane stress + isotropic damage
     tension:  sigma = ft exp(-(e1-e0)/(ef-e0)), ef = e0+Gf/(ft*h)
     compress: parabola fc(2x-x^2) to ec0=2fc/E, linear softening
               to 0.2fc at ecu (crushing)
   Steel: bilinear + rupture at eu. Bond: full fib MC2010 law.
   Solver: banded LDL^T, total-secant iteration, load steps,
   failure detection (rupture / blow-up).
   ============================================================ */
"use strict";

// ---------- banded symmetric solver ----------
function bandFactor(B, n, hb) {
  const w = hb + 1;
  for (let k = 0; k < n; k++) {
    let dkk = B[k * w];
    const m0 = Math.max(0, k - hb);
    for (let m = m0; m < k; m++) {
      const Lkm = B[k * w + (k - m)];
      dkk -= Lkm * Lkm * B[m * w];
    }
    if (Math.abs(dkk) < 1e-30) dkk = 1e-30;
    B[k * w] = dkk;
    const iMax = Math.min(n - 1, k + hb);
    for (let i = k + 1; i <= iMax; i++) {
      let s = B[i * w + (i - k)];
      const mm0 = Math.max(0, i - hb, k - hb);
      for (let m = mm0; m < k; m++) s -= B[i * w + (i - m)] * B[k * w + (k - m)] * B[m * w];
      B[i * w + (i - k)] = s / dkk;
    }
  }
}
function bandSolve(B, n, hb, f) {
  const w = hb + 1, x = Float64Array.from(f);
  for (let i = 0; i < n; i++) {
    const m0 = Math.max(0, i - hb);
    let s = x[i];
    for (let m = m0; m < i; m++) s -= B[i * w + (i - m)] * x[m];
    x[i] = s;
  }
  for (let i = 0; i < n; i++) x[i] /= B[i * w];
  for (let i = n - 1; i >= 0; i--) {
    const iMax = Math.min(n - 1, i + hb);
    let s = x[i];
    for (let j = i + 1; j <= iMax; j++) s -= B[j * w + (j - i)] * x[j];
    x[i] = s;
  }
  return x;
}

// ---------- grid / topology mesher ----------
// p.joints: [{x,y}], p.macros: [{jl:[jointIdx..], mat:matIdx}],
// p.bars: [{j1,j2,nBars,dia,Es,fy,hPct,euPct}], p.meshSize: h
// p.supports: [{type:'joint'|'line', a, b, fx, fy}]  (a,b joint indices)
// p.loads:    [{type:'joint'|'line', a, b, dir:'x'|'y', val}] val in kN or kN/m (sign kept)
function macroBBox(p, m) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const j of m.jl) {
    const J = p.joints[j];
    if (!J) continue;
    x0 = Math.min(x0, J.x); x1 = Math.max(x1, J.x);
    y0 = Math.min(y0, J.y); y1 = Math.max(y1, J.y);
  }
  return { x0, x1, y0, y1 };
}
function uniqSorted(arr, tol) {
  arr.sort((a, b) => a - b);
  const out = [];
  for (const v of arr) if (!out.length || v - out[out.length - 1] > tol) out.push(v);
  return out;
}
function buildGeometry(p) {
  const tol = 0.5;
  const h = Math.max(5, p.meshSize || 50);
  // grid seed coordinates: every joint coordinate
  let xs = [], ys = [];
  for (const J of p.joints) { xs.push(J.x); ys.push(J.y); }
  xs = uniqSorted(xs, tol); ys = uniqSorted(ys, tol);
  if (xs.length < 2 || ys.length < 2) throw new Error('Need at least 2 distinct x and y joint coordinates.');
  // subdivide intervals by target size h
  const XG = [xs[0]], YG = [ys[0]];
  for (let i = 1; i < xs.length; i++) {
    const n = Math.max(1, Math.round((xs[i] - xs[i - 1]) / h));
    for (let k = 1; k <= n; k++) XG.push(xs[i - 1] + (xs[i] - xs[i - 1]) * k / n);
  }
  for (let i = 1; i < ys.length; i++) {
    const n = Math.max(1, Math.round((ys[i] - ys[i - 1]) / h));
    for (let k = 1; k <= n; k++) YG.push(ys[i - 1] + (ys[i] - ys[i - 1]) * k / n);
  }
  const nxg = XG.length - 1, nyg = YG.length - 1;
  // cell material assignment (last macro wins)
  const cellMat = new Int16Array(nxg * nyg).fill(-1);
  const cellThk = new Float64Array(nxg * nyg);
  const boxes = p.macros.map(m => macroBBox(p, m));
  for (let i = 0; i < nxg; i++) for (let j = 0; j < nyg; j++) {
    const cx = (XG[i] + XG[i + 1]) / 2, cy = (YG[j] + YG[j + 1]) / 2;
    for (let mi = 0; mi < p.macros.length; mi++) {
      const b = boxes[mi];
      if (cx > b.x0 && cx < b.x1 && cy > b.y0 && cy < b.y1) {
        cellMat[i * nyg + j] = p.macros[mi].mat;
        cellThk[i * nyg + j] = p.macros[mi].b || p.thickness || 200;
      }
    }
  }
  // active grid nodes
  const gN = (nxg + 1) * (nyg + 1);
  const act = new Uint8Array(gN);
  const gid = (i, j) => i * (nyg + 1) + j;
  for (let i = 0; i < nxg; i++) for (let j = 0; j < nyg; j++) {
    if (cellMat[i * nyg + j] >= 0) { act[gid(i, j)] = 1; act[gid(i + 1, j)] = 1; act[gid(i, j + 1)] = 1; act[gid(i + 1, j + 1)] = 1; }
  }
  return { XG, YG, nxg, nyg, cellMat, cellThk, act, gid, tol };
}

function buildModel(p) {
  const g = buildGeometry(p);
  const { XG, YG, nxg, nyg, cellMat, cellThk, act, gid } = g;

  // ---- bar nodes: axis-aligned bars snapped to grid lines ----
  // per grid column ix collect bar nodes so numbering stays banded
  const nearIdx = (arr, v) => {
    let best = 0, bd = Infinity;
    for (let i = 0; i < arr.length; i++) { const d = Math.abs(arr[i] - v); if (d < bd) { bd = d; best = i; } }
    return best;
  };
  const barDefs = [];
  for (let bi = 0; bi < (p.bars || []).length; bi++) {
    const bd = p.bars[bi];
    const J1 = p.joints[bd.j1], J2 = p.joints[bd.j2];
    if (!J1 || !J2) continue;
    const horiz = Math.abs(J1.y - J2.y) <= Math.abs(J1.x - J2.x);
    if (horiz) {
      const jy = nearIdx(YG, (J1.y + J2.y) / 2);
      const xa = Math.min(J1.x, J2.x) - g.tol, xb = Math.max(J1.x, J2.x) + g.tol;
      const cols = [];
      for (let i = 0; i < XG.length; i++) if (XG[i] >= xa && XG[i] <= xb) cols.push(i);
      if (cols.length >= 2) barDefs.push({ def: bd, axis: 0, jy, cols });
    } else {
      const jx = nearIdx(XG, (J1.x + J2.x) / 2);
      const ya = Math.min(J1.y, J2.y) - g.tol, yb = Math.max(J1.y, J2.y) + g.tol;
      const rows = [];
      for (let j = 0; j < YG.length; j++) if (YG[j] >= ya && YG[j] <= yb) rows.push(j);
      if (rows.length >= 2) barDefs.push({ def: bd, axis: 1, jx, rows });
    }
  }
  // bar nodes per column: list of {bar, k, iy(or grid pos), x, y}
  const colBarNodes = Array.from({ length: XG.length }, () => []);
  barDefs.forEach((B, bIdx) => {
    if (B.axis === 0) {
      B.cols.forEach((ix, k) => colBarNodes[ix].push({ bIdx, k, x: XG[ix], y: YG[B.jy], gi: ix, gj: B.jy }));
    } else {
      B.rows.forEach((jy, k) => colBarNodes[B.jx].push({ bIdx, k, x: XG[B.jx], y: YG[jy], gi: B.jx, gj: jy }));
    }
  });

  // ---- node numbering (column-major, concrete then bar nodes per column) ----
  const nodeId = new Int32Array((nxg + 1) * (nyg + 1)).fill(-1);
  const Xa = [], Ya = [], isBar = [];
  const barNodeId = barDefs.map(B => new Int32Array(B.axis === 0 ? B.cols.length : B.rows.length).fill(-1));
  let nn = 0;
  for (let i = 0; i <= nxg; i++) {
    for (let j = 0; j <= nyg; j++) {
      if (act[gid(i, j)]) { nodeId[gid(i, j)] = nn++; Xa.push(XG[i]); Ya.push(YG[j]); isBar.push(0); }
    }
    for (const bn of colBarNodes[i]) {
      barNodeId[bn.bIdx][bn.k] = nn++;
      Xa.push(bn.x); Ya.push(bn.y); isBar.push(1);
    }
  }
  const nNodes = nn;
  const X = Float64Array.from(Xa), Y = Float64Array.from(Ya);

  // ---- quads ----
  const quads = [], qMat = [], qThk = [], qHel = [], qDx = [], qDy = [];
  for (let i = 0; i < nxg; i++) for (let j = 0; j < nyg; j++) {
    const m = cellMat[i * nyg + j];
    if (m < 0) continue;
    quads.push([nodeId[gid(i, j)], nodeId[gid(i + 1, j)], nodeId[gid(i + 1, j + 1)], nodeId[gid(i, j + 1)]]);
    qMat.push(m);
    qThk.push(cellThk[i * nyg + j]);
    const dx = XG[i + 1] - XG[i], dy = YG[j + 1] - YG[j];
    qHel.push(Math.sqrt(dx * dy)); qDx.push(dx); qDy.push(dy);
  }

  // ---- bar elements + bond springs ----
  const bars = [], springs = [];
  barDefs.forEach((B, bIdx) => {
    const d = B.def;
    const A = d.nBars * Math.PI * d.dia * d.dia / 4;
    const per = d.nBars * Math.PI * d.dia;
    const ids = barNodeId[bIdx];
    const coords = B.axis === 0 ? B.cols.map(ix => XG[ix]) : B.rows.map(jy => YG[jy]);
    for (let k = 0; k < ids.length - 1; k++) {
      bars.push({
        n1: ids[k], n2: ids[k + 1], axis: B.axis, L: Math.abs(coords[k + 1] - coords[k]),
        A, Es: d.Es, fy: d.fy, Eh: (d.hPct || 1) / 100 * d.Es, eu: (d.euPct != null ? d.euPct : 5) / 100
      });
    }
    for (let k = 0; k < ids.length; k++) {
      const gi = B.axis === 0 ? B.cols[k] : B.jx, gj = B.axis === 0 ? B.jy : B.rows[k];
      const cn = nodeId[gid(gi, gj)];
      if (cn < 0) continue; // bar node outside concrete
      const Lt = (k === 0 ? Math.abs(coords[1] - coords[0]) / 2 :
        k === ids.length - 1 ? Math.abs(coords[k] - coords[k - 1]) / 2 :
          (Math.abs(coords[k + 1] - coords[k]) + Math.abs(coords[k] - coords[k - 1])) / 2);
      springs.push({ nb: ids[k], nc: cn, per, Lt, axis: B.axis });
    }
  });

  // ---- supports ----
  const fixed = [];
  const nearestActive = (x, y) => {
    let best = -1, bd = Infinity;
    for (let n = 0; n < nNodes; n++) {
      if (isBar[n]) continue;
      const d = (X[n] - x) ** 2 + (Y[n] - y) ** 2;
      if (d < bd) { bd = d; best = n; }
    }
    return best;
  };
  const nodesOnSeg = (J1, J2) => {
    const out = [];
    const dx = J2.x - J1.x, dy = J2.y - J1.y, LL = Math.hypot(dx, dy);
    if (LL < 1e-9) return out;
    for (let n = 0; n < nNodes; n++) {
      if (isBar[n]) continue;
      const t = ((X[n] - J1.x) * dx + (Y[n] - J1.y) * dy) / (LL * LL);
      if (t < -1e-6 || t > 1 + 1e-6) continue;
      const px = J1.x + t * dx, py = J1.y + t * dy;
      if (Math.hypot(X[n] - px, Y[n] - py) < 1.0) out.push({ n, t });
    }
    out.sort((a, b) => a.t - b.t);
    return out;
  };
  for (const s of (p.supports || [])) {
    let nodes = [];
    if (s.type === 'joint') {
      const J = p.joints[s.a]; if (!J) continue;
      const n = nearestActive(J.x, J.y); if (n >= 0) nodes = [n];
    } else {
      const J1 = p.joints[s.a], J2 = p.joints[s.b]; if (!J1 || !J2) continue;
      nodes = nodesOnSeg(J1, J2).map(o => o.n);
    }
    for (const n of nodes) {
      if (s.fx) fixed.push(2 * n);
      if (s.fy) fixed.push(2 * n + 1);
    }
  }

  // ---- loads (reference vector, N) ----
  const F = new Float64Array(2 * nNodes);
  for (const ld of (p.loads || [])) {
    const dof = ld.dir === 'x' ? 0 : 1;
    if (ld.type === 'joint') {
      const J = p.joints[ld.a]; if (!J) continue;
      const n = nearestActive(J.x, J.y);
      if (n >= 0) F[2 * n + dof] += ld.val * 1000; // kN -> N, sign kept
    } else {
      const J1 = p.joints[ld.a], J2 = p.joints[ld.b]; if (!J1 || !J2) continue;
      const seg = nodesOnSeg(J1, J2);
      if (seg.length < 2) continue;
      const LL = Math.hypot(J2.x - J1.x, J2.y - J1.y);
      const q = ld.val; // kN/m == N/mm, sign kept
      for (let k = 0; k < seg.length; k++) {
        const tPrev = k === 0 ? seg[0].t : seg[k - 1].t;
        const tNext = k === seg.length - 1 ? seg[k].t : seg[k + 1].t;
        const trib = ((seg[k].t - tPrev) / 2 + (tNext - seg[k].t) / 2) * LL;

  }

  if (p.selfWeight) {
    for (let e = 0; e < quads.length; e++) {
      const w = 24e-6 * qThk[e] * qDx[e] * qDy[e] / 4; // 24 kN/m3
      for (const n of quads[e]) F[2 * n + 1] -= w;
    }
  }

  // ---- half bandwidth ----
  let hb = 0;
  const upd = (a, b2) => { hb = Math.max(hb, Math.abs(2 * a - 2 * b2) + 1); };
  for (const q of quads) for (let i = 0; i < 4; i++) for (let j = i; j < 4; j++) upd(q[i], q[j]);
  for (const bel of bars) upd(bel.n1, bel.n2);
  for (const s of springs) upd(s.nb, s.nc);

  // average cell size (for crack marker scale)
  let adx = 0, ady = 0;
  for (let e = 0; e < quads.length; e++) { adx += qDx[e]; ady += qDy[e]; }
  adx = quads.length ? adx / quads.length : 50; ady = quads.length ? ady / quads.length : 50;

  if (!quads.length) throw new Error('No finite elements generated — check macro-elements and joints.');
  if (!fixed.length) throw new Error('No supports defined — structure is unconstrained.');

  return {
    p, geom: g, nNodes, X, Y, isBar: Uint8Array.from(isBar),
    quads, qMat, qThk, qHel, qDx, qDy, bars, springs, fixed, F, hb,
    dx: adx, dy: ady

}

// ---------- Q4 plane stress ----------
const GP = [-1 / Math.sqrt(3), 1 / Math.sqrt(3)];
function q4B(xe, ye, xi, eta) {
  const dN = [
    [-(1 - eta) / 4, (1 - eta) / 4, (1 + eta) / 4, -(1 + eta) / 4],
    [-(1 - xi) / 4, -(1 + xi) / 4, (1 + xi) / 4, (1 - xi) / 4]
  ];
  let J00 = 0, J01 = 0, J10 = 0, J11 = 0;
  for (let a = 0; a < 4; a++) {
    J00 += dN[0][a] * xe[a]; J01 += dN[0][a] * ye[a];
    J10 += dN[1][a] * xe[a]; J11 += dN[1][a] * ye[a];
  }
  const detJ = J00 * J11 - J01 * J10;
  const i00 = J11 / detJ, i01 = -J01 / detJ, i10 = -J10 / detJ, i11 = J00 / detJ;
  const B = new Float64Array(24);
  for (let a = 0; a < 4; a++) {
    const dNx = i00 * dN[0][a] + i01 * dN[1][a];
    const dNy = i10 * dN[0][a] + i11 * dN[1][a];
    B[0 * 8 + 2 * a] = dNx;
    B[1 * 8 + 2 * a + 1] = dNy;
    B[2 * 8 + 2 * a] = dNy;
    B[2 * 8 + 2 * a + 1] = dNx;
  }
  return { B, detJ };
}
function q4Stiffness(xe, ye, D, t) {
  const K = new Float64Array(64);
  for (const xi of GP) for (const eta of GP) {
    const { B, detJ } = q4B(xe, ye, xi, eta);
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      let s = 0;
      for (let a = 0; a < 3; a++) for (let c = 0; c < 3; c++) s += B[a * 8 + i] * D[a * 3 + c] * B[c * 8 + j];
      K[i * 8 + j] += s * detJ * t;
    }
  }
  return K;
}
function Dmat(E, nu) {
  const c = E / (1 - nu * nu);
  return [c, c * nu, 0, c * nu, c, 0, 0, 0, c * (1 - nu) / 2];
}

// ---------- material laws ----------
function concreteDamage(eps, mat, hel) {
  const [exx, eyy, gxy] = eps;
  const cm = (exx + eyy) / 2, rr = Math.sqrt(((exx - eyy) / 2) ** 2 + (gxy / 2) ** 2);
  const e1 = cm + rr, e2 = cm - rr;
  const ang = 0.5 * Math.atan2(gxy, exx - eyy);
  const e0 = mat.ft / mat.E;
  let ef = e0 + mat.Gf / (mat.ft * hel);
  if (ef < 1.2 * e0) ef = 1.2 * e0;
  let dt = 0, cracked = 0, cw = 0;
  if (e1 > e0) {
    dt = 1 - (e0 / e1) * Math.exp(-(e1 - e0) / (ef - e0));
    cracked = 1;
    cw = (e1 - e0) * hel;
  }
  let dc = 0, crushed = 0;
  const ec = -Math.min(e2, 0);
  const ec0 = 2 * mat.fc / mat.E;
  const ecu = mat.ecu || 0.0035;
  const RES = 0.2;
  if (ec > 1e-12) {
    let sig;
    if (ec <= ec0) { const x = ec / ec0; sig = mat.fc * (2 * x - x * x); }
    else if (ec <= ecu) sig = mat.fc * (1 - (1 - RES) * (ec - ec0) / (ecu - ec0));
    else { sig = RES * mat.fc; crushed = 1; }
    dc = 1 - sig / (mat.E * ec);
    if (dc < 0) dc = 0;
  }
  let d = Math.max(dt, dc);
  if (d > 0.998) d = 0.998;
  return { d, ang, cracked, crushed, e1, e2, cw };
}
function steelSecant(eps, bar, ruptured) {
  const ey = bar.fy / bar.Es, ae = Math.abs(eps);
  const eu = bar.eu || 0.05;
  if (ruptured || ae >= eu) return bar.Es * 1e-6;
  if (ae <= ey || ae < 1e-12) return bar.Es;
  const sig = bar.fy + bar.Eh * (ae - ey);
  return sig / ae;
}
function bondTau(s, bond) {
  const tf = (bond.tauF != null) ? bond.tauF : 0.4 * bond.tauMax;
  const s2 = bond.s2 || 2, s3 = Math.max(bond.s3 || 6, s2 + 0.01);
  if (s <= bond.s1) return bond.tauMax * Math.pow(s / bond.s1, bond.alpha);
  if (s <= s2) return bond.tauMax;
  if (s <= s3) return bond.tauMax - (bond.tauMax - tf) * (s - s2) / (s3 - s2);

}
function bondSecant(slip, bond, per, Lt) {
  if (bond.perfect) return 1e9;
  const s = Math.max(Math.abs(slip), 0.005);
  return bondTau(s, bond) * per * Lt / s;
}

// ---------- assembly + solve ----------
function assembleSolve(model, lambda, secants) {
  const nd = 2 * model.nNodes, hb = model.hb, w = hb + 1;
  const B = new Float64Array(nd * w);
  const add = (r, c, v) => {
    if (r < c) { const t = r; r = c; c = t; }
    B[r * w + (r - c)] += v;
  };
  const mats = model.p.materials;
  for (let e = 0; e < model.quads.length; e++) {
    const q = model.quads[e];
    const xe = q.map(n => model.X[n]), ye = q.map(n => model.Y[n]);
    const mat = mats[model.qMat[e]];
    const D = Dmat(mat.E * (1 - secants.dmg[e]), mat.nu);
    const Ke = q4Stiffness(xe, ye, D, model.qThk[e]);
    const dofs = [];
    for (const n of q) dofs.push(2 * n, 2 * n + 1);
    for (let i = 0; i < 8; i++) for (let j = 0; j <= i; j++) add(dofs[i], dofs[j], Ke[i * 8 + j]);
  }
  for (let ib = 0; ib < model.bars.length; ib++) {
    const bel = model.bars[ib];
    const k = secants.barE[ib] * bel.A / bel.L;
    const d = bel.axis; // 0=x, 1=y
    add(2 * bel.n1 + d, 2 * bel.n1 + d, k);
    add(2 * bel.n2 + d, 2 * bel.n2 + d, k);
    add(Math.max(2 * bel.n1 + d, 2 * bel.n2 + d), Math.min(2 * bel.n1 + d, 2 * bel.n2 + d), -k);
  }
  for (let is = 0; is < model.springs.length; is++) {
    const s = model.springs[is];
    const kb = secants.bondK[is], kd = 1e7;
    const a = s.axis, o = 1 - s.axis;
    const pair = (dof, kk) => {
      add(2 * s.nb + dof, 2 * s.nb + dof, kk);
      add(2 * s.nc + dof, 2 * s.nc + dof, kk);
      add(Math.max(2 * s.nb + dof, 2 * s.nc + dof), Math.min(2 * s.nb + dof, 2 * s.nc + dof), -kk);
    };
    pair(a, kb); pair(o, kd);
  }
  for (let n = 0; n < model.nNodes; n++) {
    if (B[(2 * n) * w] === 0) B[(2 * n) * w] = 1;
    if (B[(2 * n + 1) * w] === 0) B[(2 * n + 1) * w] = 1;
  }
  for (const dof of model.fixed) B[dof * w] += 1e15;
  const f = new Float64Array(nd);
  for (let i = 0; i < nd; i++) f[i] = lambda * model.F[i];
  bandFactor(B, nd, hb);
  return bandSolve(B, nd, hb, f);
}

function quadStrain(model, e, u) {
  const q = model.quads[e];
  const xe = q.map(n => model.X[n]), ye = q.map(n => model.Y[n]);
  const { B } = q4B(xe, ye, 0, 0);
  const ue = [];
  for (const n of q) ue.push(u[2 * n], u[2 * n + 1]);
  const eps = [0, 0, 0];
  for (let a = 0; a < 3; a++) for (let i = 0; i < 8; i++) eps[a] += B[a * 8 + i] * ue[i];

}
function barStrain(model, ib, u) {
  const bel = model.bars[ib], d = bel.axis;
  return (u[2 * bel.n2 + d] - u[2 * bel.n1 + d]) / bel.L * Math.sign(
    d === 0 ? model.X[bel.n2] - model.X[bel.n1] : model.Y[bel.n2] - model.Y[bel.n1]);
}

// ---------- nonlinear driver ----------
function runAnalysis(p, log) {
  const model = buildModel(p);
  const nQ = model.quads.length;
  const state = {
    dmg: new Float64Array(nQ),
    crackAng: new Float64Array(nQ).fill(NaN),
    cracked: new Uint8Array(nQ),
    crushed: new Uint8Array(nQ),
    barRupt: new Uint8Array(model.bars.length),
    events: { firstCrack: 0, firstYield: 0, firstCrush: 0, firstRupt: 0 }
  };
  const results = [];
  const nSteps = p.run.linear ? 1 : p.run.steps;
  let u = null;
  const secants = {
    dmg: new Float64Array(nQ),
    barE: Float64Array.from(model.bars.map(b => b.Es)),
    bondK: new Float64Array(model.springs.length)
  };
  for (let is = 0; is < model.springs.length; is++) {
    const s = model.springs[is];
    secants.bondK[is] = bondSecant(0, p.bond, s.per, s.Lt);

  for (let step = 1; step <= nSteps; step++) {

      if (p.run.linear) { conv = true; break; }
      let maxChange = 0;
      for (let e = 0; e < nQ; e++) {
        const eps = quadStrain(model, e, u);
        const r = concreteDamage(eps, mats[model.qMat[e]], model.qHel[e]);
        const dNew = Math.max(state.dmg[e], r.d);
        maxChange = Math.max(maxChange, Math.abs(dNew - secants.dmg[e]));
        secants.dmg[e] = dNew;
        if (r.cracked && !state.cracked[e]) state.crackAng[e] = r.ang;
      }
      for (let ib = 0; ib < model.bars.length; ib++) {
        const bel = model.bars[ib];
        const eps = barStrain(model, ib, u);
        if (Math.abs(eps) >= bel.eu) state.barRupt[ib] = 1;
        const Enew = steelSecant(eps, bel, state.barRupt[ib]);
        maxChange = Math.max(maxChange, Math.abs(Enew - secants.barE[ib]) / bel.Es);
        secants.barE[ib] = Enew;
      }
      for (let is2 = 0; is2 < model.springs.length; is2++) {
        const s = model.springs[is2];
        const slip = u[2 * s.nb + s.axis] - u[2 * s.nc + s.axis];
        secants.bondK[is2] = bondSecant(slip, p.bond, s.per, s.Lt);
      }
      if (maxChange < p.run.tol) { conv = true; break; }
    }
    // commit
    for (let e = 0; e < nQ; e++) {
      if (secants.dmg[e] > state.dmg[e]) state.dmg[e] = secants.dmg[e];
      const eps = quadStrain(model, e, u);
      const r = concreteDamage(eps, mats[model.qMat[e]], model.qHel[e]);
      if (r.cracked) state.cracked[e] = 1;
      if (r.crushed) state.crushed[e] = 1;
    }
    const res = collectResults(model, state, u, p, lambda, secants);
    res.step = step; res.lambda = lambda; res.iters = it; res.converged = conv;
    results.push(res);
    if (log) log(`Step ${step}/${nSteps}  λ=${lambda.toFixed(2)}  iters=${it}${conv ? '' : ' (max iters reached)'}  max defl=${res.maxDefl.toFixed(3)} mm  w_max=${res.maxCW.toFixed(3)} mm`);
    if (log && !p.run.linear) {
      const ev = state.events;
      if (!ev.firstCrack && res.nCracked > 0) { ev.firstCrack = step; log(`  ▸ FIRST CRACKING at λ=${lambda.toFixed(2)}`); }
      if (!ev.firstYield && res.nYield > 0) { ev.firstYield = step; log(`  ▸ STEEL YIELDING starts at λ=${lambda.toFixed(2)} (σs ≥ fy)`); }
      if (!ev.firstCrush && res.nCrushed > 0) { ev.firstCrush = step; log(`  ▸ CONCRETE CRUSHING starts at λ=${lambda.toFixed(2)} (εc ≥ εcu)`); }
      if (!ev.firstRupt && res.nRupt > 0) { ev.firstRupt = step; log(`  ▸ BAR RUPTURE at λ=${lambda.toFixed(2)} (εs ≥ εu)`); }
    }
    if (!p.run.linear && step > 1) {
      const prev = results[results.length - 2];
      const span = Math.max(...model.X) - Math.min(...model.X);
      const blowup = res.maxDefl > 3 * Math.max(prev.maxDefl, 1e-6) && res.maxDefl > span / 100;
      const rupture = res.nRupt > 0 && (prev.nRupt || 0) === 0;

        let mode = [];
        if (res.nRupt > 0) mode.push('reinforcement rupture');
        if (res.nYield > 0 && res.nCrushed > 0) mode.push('flexural failure (steel yielding + concrete crushing)');
        else if (res.nCrushed > 0) mode.push('concrete crushing (brittle, over-reinforced/compression)');
        else if (res.nYield > 0) mode.push('flexural mechanism (steel yielding + wide cracking)');
        if (!mode.length) mode.push('loss of equilibrium');
        if (log) log(`  ■ STRUCTURAL FAILURE detected at λ=${lambda.toFixed(2)} — ultimate load ≈ ${(results[results.length - 2].lambda * 100).toFixed(0)}–${(lambda * 100).toFixed(0)}% of applied. Mode: ${mode.join(' + ')}.`);
        res.failed = true; res.failureMode = mode.join(' + ');

      }

  }

}

function collectResults(model, state, u, p, lambda, secants) {
  const nQ = model.quads.length, mats = p.materials;
  const el = {
    sxx: new Float64Array(nQ), syy: new Float64Array(nQ), sxy: new Float64Array(nQ),
    s1: new Float64Array(nQ), s2: new Float64Array(nQ),
    exx: new Float64Array(nQ), eyy: new Float64Array(nQ), e1: new Float64Array(nQ),
    dmg: new Float64Array(nQ), ang: new Float64Array(nQ),
    cracked: new Uint8Array(nQ), crushed: new Uint8Array(nQ),
    cw: new Float64Array(nQ)

  for (let e = 0; e < nQ; e++) {
    const eps = quadStrain(model, e, u);
    const mat = mats[model.qMat[e]];
    const d = state.dmg[e];
    const D = Dmat(mat.E * (1 - d), mat.nu);
    const s = [D[0] * eps[0] + D[1] * eps[1], D[3] * eps[0] + D[4] * eps[1], D[8] * eps[2]];
    el.sxx[e] = s[0]; el.syy[e] = s[1]; el.sxy[e] = s[2];
    const cm = (s[0] + s[1]) / 2, rr = Math.sqrt(((s[0] - s[1]) / 2) ** 2 + s[2] ** 2);
    el.s1[e] = cm + rr; el.s2[e] = cm - rr;
    el.exx[e] = eps[0]; el.eyy[e] = eps[1];
    const cme = (eps[0] + eps[1]) / 2, rre = Math.sqrt(((eps[0] - eps[1]) / 2) ** 2 + (eps[2] / 2) ** 2);
    el.e1[e] = cme + rre;
    el.dmg[e] = d;
    el.ang[e] = state.crackAng[e];
    el.cracked[e] = d > 0.02 && !isNaN(state.crackAng[e]) ? 1 : 0;
    const rD = concreteDamage(eps, mat, model.qHel[e]);
    el.cw[e] = el.cracked[e] ? rD.cw : 0;
    el.crushed[e] = state.crushed[e];
  }
  const bars = model.bars.map((bel, ib) => {
    const eps = barStrain(model, ib, u);
    const rupt = state.barRupt[ib];
    const Esec = secants ? secants.barE[ib] : bel.Es;
    return { eps, sig: rupt ? 0 : Esec * eps, yielded: Math.abs(eps) > bel.fy / bel.Es ? 1 : 0, ruptured: rupt };
  });
  const springs = model.springs.map((s, is2) => {
    const slip = u[2 * s.nb + s.axis] - u[2 * s.nc + s.axis];
    const K = secants ? secants.bondK[is2] : 0;
    return { slip, tau: s.per * s.Lt > 0 ? K * slip / (s.per * s.Lt) : 0 };
  });
  let maxDefl = 0, maxSteel = 0, maxSlip = 0, maxCW = 0;
  for (let n = 0; n < model.nNodes; n++) maxDefl = Math.max(maxDefl, Math.abs(u[2 * n + 1]));
  for (const b of bars) maxSteel = Math.max(maxSteel, Math.abs(b.sig));
  for (const s of springs) maxSlip = Math.max(maxSlip, Math.abs(s.slip));
  for (let e = 0; e < nQ; e++) maxCW = Math.max(maxCW, el.cw[e]);
  let nCracked = 0, nCrushed = 0, nYield = 0, nRupt = 0;
  for (let e = 0; e < nQ; e++) { if (el.cracked[e]) nCracked++; if (el.crushed[e]) nCrushed++; }
  for (const b of bars) { if (b.yielded) nYield++; if (b.ruptured) nRupt++; }
  return { u: Float64Array.from(u), el, bars, springs, maxDefl, maxSteel, maxSlip, maxCW, nCracked, nCrushed, nYield, nRupt };
}

if (typeof module !== "undefined") module.exports = { buildGeometry, buildModel, runAnalysis, concreteDamage, bondTau };

      { id: 'chart', label: 'Load–deflection chart', icon: '📉' },
      { id: 'summary', label: 'Summary table', icon: '📄' }]
  }
];
function buildTree() {
  const root = $('tree'); root.innerHTML = '';
  const title = document.createElement('div');
  title.className = 'tree-root'; title.textContent = App.params.title;
  root.appendChild(title);
  const walk = (items, depth) => {
    for (const it of items) {
      const d = document.createElement('div');
      d.className = 'tree-item' + (it.bold ? ' tree-bold' : '');
      d.style.paddingLeft = (10 + depth * 16) + 'px';
      d.innerHTML = `<span class="ticon">${it.icon}</span>${it.label}`;
      if (it.id) { d.dataset.id = it.id; d.onclick = () => selectItem(it.id); }
      root.appendChild(d);
      if (it.children) walk(it.children, depth + 1);
    }
  };
  walk(TREE, 0);
}
function selectItem(id) {
  App.selected = id;
  document.querySelectorAll('.tree-item').forEach(e => e.classList.toggle('sel', e.dataset.id === id));
  renderForm();
  updateMatPlot();
  if (id === 'results' && App.results) App.view.mode = 'results';
  else if (id === 'chart' && App.results) App.view.mode = 'chart';
  else if (id !== 'summary') App.view.mode = 'model';
  draw();
}

// ------------------- form binding -------------------
function num(id, def) { const v = parseFloat(($(id) || {}).value); return isFinite(v) ? v : def; }
function bindTable(tableId, arr, after) {
  document.querySelectorAll(`#${tableId} input, #${tableId} select`).forEach(inp => {
    inp.addEventListener('change', () => {
      const i = +inp.dataset.i, k = inp.dataset.k;
      if (!arr[i]) return;
      if (inp.type === 'checkbox') arr[i][k] = inp.checked;
      else if (k === 'name') arr[i][k] = inp.value;
      else if (k === 'jl') arr[i][k] = inp.value.split(',').map(s => Math.max(0, (parseInt(s.trim()) || 1) - 1));
      else if (k === 'type' || k === 'dir') arr[i][k] = inp.value;
      else if (inp.tagName === 'SELECT') arr[i][k] = parseInt(inp.value);
      else arr[i][k] = parseFloat(inp.value) || 0;
      if (after) after(); else { draw(); }
    });
  });
  document.querySelectorAll(`#${tableId} [data-del]`).forEach(b2 => b2.addEventListener('click', () => {
    arr.splice(+b2.dataset.del, 1); renderForm(); updateMatPlot(); draw();
  }));
}
function bindForm() {
  const p = App.params, id = App.selected;
  const on = (i, ev, fn) => { const e = $(i); if (e) e.addEventListener(ev, fn); };
  const commit = () => {
    if (id === 'general') { p.title = ($('f-title') || {}).value || p.title; p.selfWeight = !!($('f-sw') || {}).checked; buildTree(); selectItem(id); return; }
    if (id === 'bond') {
      p.bond.perfect = !!($('f-perfect') || {}).checked;
      p.bond.tauMax = num('f-tau', p.bond.tauMax); p.bond.s1 = num('f-s1', p.bond.s1); p.bond.alpha = num('f-alpha', p.bond.alpha);
      p.bond.s2 = num('f-s2', p.bond.s2); p.bond.s3 = num('f-s3', p.bond.s3); p.bond.tauF = num('f-tauf', p.bond.tauF);
      updateMatPlot();
    }
    if (id === 'mesh') { p.meshSize = Math.max(5, num('f-msize', p.meshSize)); renderForm(); }
    if (id === 'analysis') {
      p.run.linear = !!($('f-linear') || {}).checked;

  on('f-addbar', 'click', () => { p.bars.push({ j1: 0, j2: 1, nBars: 2, dia: 12, Es: 200000, fy: 500, hPct: 1, euPct: 5 }); renderForm(); draw(); });
  on('f-addbarline', 'click', () => {

  });
  on('f-addjoint', 'click', () => { p.joints.push({ x: 0, y: 0 }); renderForm(); draw(); });
  on('f-addline', 'click', () => { p.lines.push({ a: 0, b: 1 }); renderForm(); draw(); });

  on('f-matplot-sel', 'change', updateMatPlot);

// ------------------- material diagrams (messages panel) -------------------
function updateMatPlot() {
  const cvp = $('matplot'); if (!cvp) return;
  const id = App.selected;
  if (id === 'materials') { cvp.style.display = 'block'; plotConcrete(App.params.materials[+(($('f-matplot-sel') || {}).value || 0)] || App.params.materials[0]); }
  else if (id === 'bars-mat' || id === 'geometry-bars') { cvp.style.display = 'block'; plotSteel(App.params.bars[0]); }
  else if (id === 'bond') { cvp.style.display = 'block'; plotBond(App.params.bond); }
  else cvp.style.display = 'none';
}
function plotFrame(c, title, xlab, ylab) {
  const W = c.canvas.width, H = c.canvas.height;
  c.fillStyle = '#10151c'; c.fillRect(0, 0, W, H);
  c.strokeStyle = '#2a3442'; c.lineWidth = 1;
  c.font = '11px monospace'; c.fillStyle = '#9fb3c8';
  c.fillText(title, 8, 13);
  c.fillText(xlab, W - 90, H - 6);
  c.save(); c.translate(10, 90); c.rotate(-Math.PI / 2); c.fillText(ylab, 0, 0); c.restore();
  return { mL: 45, mR: 12, mT: 20, mB: 22, W, H };
}
function plotCurve(c, fr, pts, xmin, xmax, ymin, ymax, color) {
  const px = x => fr.mL + (x - xmin) / (xmax - xmin) * (fr.W - fr.mL - fr.mR);
  const py = y => fr.mT + (1 - (y - ymin) / (ymax - ymin)) * (fr.H - fr.mT - fr.mB);
  // axes through zero
  c.strokeStyle = '#3a4a5c';
  c.beginPath(); c.moveTo(px(xmin), py(0)); c.lineTo(px(xmax), py(0)); c.stroke();
  c.beginPath(); c.moveTo(px(0), py(ymin)); c.lineTo(px(0), py(ymax)); c.stroke();
  c.strokeStyle = color; c.lineWidth = 1.8;
  c.beginPath();
  pts.forEach(([x, y], i) => { if (i === 0) c.moveTo(px(x), py(y)); else c.lineTo(px(x), py(y)); });
  c.stroke(); c.lineWidth = 1;
  c.fillStyle = '#8fa';
  return { px, py };
}
function plotConcrete(m) {
  if (!m) return;
  const c = $('matplot').getContext('2d');
  const fr = plotFrame(c, `σ–ε concrete: ${m.name}  (h=${App.params.meshSize} mm)`, 'ε [‰]', 'σ [MPa]');
  const e0c = 2 * m.fc / m.E, ecu = m.ecu, e0t = m.ft / m.E;
  const hel = App.params.meshSize;
  let ef = e0t + m.Gf / (m.ft * hel); if (ef < 1.2 * e0t) ef = 1.2 * e0t;
  const pts = [];
  for (let e = -1.15 * ecu; e <= 0; e += ecu / 60) {
    const ec = -e; let s;
    if (ec <= e0c) { const x = ec / e0c; s = m.fc * (2 * x - x * x); }
    else if (ec <= ecu) s = m.fc * (1 - 0.8 * (ec - e0c) / (ecu - e0c));
    else s = 0.2 * m.fc;
    pts.push([e * 1000, -s]);
  }
  for (let e = 0; e <= 3.2 * ef; e += ef / 40) {
    const s = e <= e0t ? m.E * e : m.ft * Math.exp(-(e - e0t) / (ef - e0t));
    pts.push([e * 1000, s]);
  }
  const { px, py } = plotCurve(c, fr, pts, -1.2 * ecu * 1000, 3.3 * ef * 1000, -1.12 * m.fc, 1.6 * m.ft, '#00d0ff');
  c.fillStyle = '#9fb3c8'; c.font = '10px monospace';
  c.fillText(`fc=${m.fc}`, px(-ecu * 1000), py(-m.fc) - 4);
  c.fillText(`ft=${m.ft}`, px(e0t * 1000) + 3, py(m.ft) - 4);
  c.fillText(`εcu=${(ecu * 1000).toFixed(1)}‰ (crush)`, px(-ecu * 1000), py(-0.2 * m.fc) + 12);
}
function plotSteel(b2) {
  if (!b2) return;
  const c = $('matplot').getContext('2d');
  const fr = plotFrame(c, `σ–ε reinforcement: bar 1 (Ø${b2.dia})`, 'ε [%]', 'σ [MPa]');
  const ey = b2.fy / b2.Es, eu = (b2.euPct || 5) / 100, Eh = (b2.hPct || 1) / 100 * b2.Es;
  const fu = b2.fy + Eh * (eu - ey);
  const pts = [[0, 0], [ey * 100, b2.fy], [eu * 100, fu], [eu * 100, 0], [eu * 108, 0]];
  const { px, py } = plotCurve(c, fr, pts, 0, eu * 112, 0, 1.25 * fu, '#ffd000');
  c.fillStyle = '#9fb3c8'; c.font = '10px monospace';
  c.fillText(`fy=${b2.fy}`, px(ey * 100) + 4, py(b2.fy) - 5);
  c.fillText(`rupture εu=${(eu * 100).toFixed(1)}%`, px(eu * 100) - 95, py(fu) - 6);
}
function plotBond(bd) {
  const c = $('matplot').getContext('2d');
  const fr = plotFrame(c, bd.perfect ? 'Bond: PERFECT (rigid)' : 'Bond τ–s (fib MC2010)', 's [mm]', 'τ [MPa]');
  if (bd.perfect) return;
  const pts = [];
  const smax = bd.s3 * 1.25;
  for (let s = 0; s <= smax; s += smax / 160) pts.push([s, bondTau(Math.max(s, 1e-4), bd)]);
  const { px, py } = plotCurve(c, fr, pts, 0, smax, 0, 1.25 * bd.tauMax, '#ff5db1');
  c.fillStyle = '#9fb3c8'; c.font = '10px monospace';
  c.fillText(`τmax=${bd.tauMax}`, px(bd.s1), py(bd.tauMax) - 5);
  c.fillText(`τf=${bd.tauF}`, px(bd.s3) + 3, py(bd.tauF) - 4);
}

// ------------------- run -------------------
function runNow() {
  const st = $('run-status'); if (st) st.textContent = 'Running…';
  logMsg('--- RUN: ' + App.params.title + ' ---', 'log-h');
  setTimeout(() => {
    try {
      const t0 = performance.now();
      const out = runAnalysis(App.params, m => logMsg(m));
      App.model = out.model; App.results = out.results;
      App.view.step = out.results.length - 1;
      const last = out.results[out.results.length - 1];
      logMsg(`Done in ${((performance.now() - t0) / 1000).toFixed(2)} s. Max deflection ${last.maxDefl.toFixed(3)} mm, w_max ${(last.maxCW || 0).toFixed(3)} mm, max steel ${last.maxSteel.toFixed(0)} MPa, ${last.nCracked} cracked / ${last.nCrushed || 0} crushed elems, ${last.nYield || 0} yielded / ${last.nRupt || 0} ruptured bars.`, last.failed ? 'log-err' : 'log-ok');
      if (st) st.textContent = 'Finished ✓ — open Results ▸ Post-processing.';
      selectItem('results');
      App.view.mode = 'results';
      fit(); draw();
    } catch (err) {
      logMsg('ERROR: ' + err.message, 'log-err');
      if (st) st.textContent = 'Failed: ' + err.message;
    }
  }, 30);
}

// ------------------- canvas -------------------
let cv, ctx;
function bbox() {
  const p = App.params;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const J of p.joints) { x0 = Math.min(x0, J.x); x1 = Math.max(x1, J.x); y0 = Math.min(y0, J.y); y1 = Math.max(y1, J.y); }
  if (!isFinite(x0)) { x0 = 0; x1 = 1000; y0 = 0; y1 = 500; }
  return { x0, x1, y0, y1, w: Math.max(x1 - x0, 10), h: Math.max(y1 - y0, 10) };
}
function fit() {
  const bb = bbox(), W = cv.width, Hc = cv.height, m = 70;
  const s = Math.min((W - 2 * m) / bb.w, (Hc - 2 * m) / bb.h);
  App.cam.scale = s;
  App.cam.ox = (W - s * bb.w) / 2 - s * bb.x0;
  App.cam.oy = Hc - ((Hc - s * bb.h) / 2 - s * bb.y0);
}
function w2s(x, y) { return [App.cam.ox + x * App.cam.scale, App.cam.oy - y * App.cam.scale]; }
function cmap(t) {
  t = Math.max(0, Math.min(1, t));
  const r = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 3)));
  const g = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 2)));
  const b2 = Math.max(0, Math.min(1, 1.5 - Math.abs(4 * t - 1)));
  return `rgb(${Math.round(255 * r)},${Math.round(255 * g)},${Math.round(255 * b2)})`;
}
function line(a, b2, c, d) { ctx.beginPath(); ctx.moveTo(a, b2); ctx.lineTo(c, d); ctx.stroke(); }
function nodeXY(model, n, u, sc) {
  let x = model.X[n], y = model.Y[n];
  if (u && sc) { x += u[2 * n] * sc; y += u[2 * n + 1] * sc; }
  return [x, y];
}
function hudText(s) { ctx.fillStyle = '#9adcff'; ctx.font = '12px monospace'; ctx.fillText(s, 12, 18); }

function draw() {
  if (!ctx) return;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (App.view.mode === 'chart' && App.results) { drawChart(); return; }
  drawAxes();
  if (App.view.mode === 'results' && App.results) drawResults();
  else drawModel();
}
function drawAxes() {
  const [x0, y0] = w2s(0, 0);
  ctx.strokeStyle = '#ffff00'; ctx.fillStyle = '#ffff00'; ctx.lineWidth = 1.2;
  const ax = 46;
  line(x0, y0, x0 + ax, y0);
  ctx.beginPath(); ctx.moveTo(x0 + ax, y0); ctx.lineTo(x0 + ax - 7, y0 - 3); ctx.lineTo(x0 + ax - 7, y0 + 3); ctx.fill();
  line(x0, y0, x0, y0 - ax);
  ctx.beginPath(); ctx.moveTo(x0, y0 - ax); ctx.lineTo(x0 - 3, y0 - ax + 7); ctx.lineTo(x0 + 3, y0 - ax + 7); ctx.fill();
  ctx.font = '13px monospace';
  ctx.fillText('X', x0 + ax + 6, y0 + 4); ctx.fillText('Y', x0 - 4, y0 - ax - 6);
}

const MAT_FILLS = ['#4a4f55', '#5a5145', '#45525a', '#525a45', '#5a4552'];
function drawModel() {
  const p = App.params;
  // geometry preview
  let g = null;
  try { g = buildGeometry(p); } catch (e) { /* ignore */ }
  if (g) {
    // active cells fill + mesh
    for (let i = 0; i < g.nxg; i++) for (let j = 0; j < g.nyg; j++) {
      const m = g.cellMat[i * g.nyg + j];
      if (m < 0) continue;
      const [a, b2] = w2s(g.XG[i], g.YG[j + 1]);
      const [c, d] = w2s(g.XG[i + 1], g.YG[j]);
      ctx.fillStyle = MAT_FILLS[m % MAT_FILLS.length];
      ctx.fillRect(a, b2, c - a, d - b2);
      if (App.view.showMesh) { ctx.strokeStyle = 'rgba(0,190,190,0.55)'; ctx.lineWidth = 0.5; ctx.strokeRect(a, b2, c - a, d - b2); }
    }
  }
  // lines
  ctx.strokeStyle = '#00ffee'; ctx.lineWidth = 1.4;
  for (const L of p.lines) {
    const J1 = p.joints[L.a], J2 = p.joints[L.b];
    if (!J1 || !J2) continue;
    const [a, b2] = w2s(J1.x, J1.y), [c, d] = w2s(J2.x, J2.y);
    line(a, b2, c, d);
  }
  // macro outlines
  ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 1.6;
  for (const m of p.macros) {
    const bb = macroBBox(p, m);
    if (!isFinite(bb.x0)) continue;
    const [a, b2] = w2s(bb.x0, bb.y1), [c, d] = w2s(bb.x1, bb.y0);
    ctx.strokeRect(a, b2, c - a, d - b2);
  }
  // rebar
  ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 2.5;
  for (const b2 of p.bars) {
    const J1 = p.joints[b2.j1], J2 = p.joints[b2.j2];
    if (!J1 || !J2) continue;
    const [a, bb2] = w2s(J1.x, J1.y), [c, d] = w2s(J2.x, J2.y);
    line(a, bb2, c, d);
  }
  // supports
  for (const s of (p.supports || [])) {
    const pts = [];
    if (s.type === 'joint') { const J = p.joints[s.a]; if (J) pts.push(J); }
    else {
      const J1 = p.joints[s.a], J2 = p.joints[s.b];
      if (J1 && J2) for (let t = 0; t <= 1.0001; t += 0.2) pts.push({ x: J1.x + (J2.x - J1.x) * t, y: J1.y + (J2.y - J1.y) * t });
    }
    ctx.fillStyle = '#ffcc00'; ctx.strokeStyle = '#ffcc00'; ctx.lineWidth = 1.4;
    for (const pt of pts) {
      const [sx, sy] = w2s(pt.x, pt.y);
      if (s.fy) { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - 8, sy + 13); ctx.lineTo(sx + 8, sy + 13); ctx.closePath(); ctx.fill(); }
      if (s.fx) { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx - 13, sy - 8); ctx.lineTo(sx - 13, sy + 8); ctx.closePath(); ctx.fill(); }
    }
  }
  // loads (magenta, like ATENA)
  ctx.strokeStyle = '#ff44ff'; ctx.fillStyle = '#ff44ff'; ctx.lineWidth = 2;
  for (const l of (p.loads || [])) {
    const pts = [];
    if (l.type === 'joint') { const J = p.joints[l.a]; if (J) pts.push(J); }
    else {
      const J1 = p.joints[l.a], J2 = p.joints[l.b];
      if (J1 && J2) for (let t = 0; t <= 1.0001; t += 0.25) pts.push({ x: J1.x + (J2.x - J1.x) * t, y: J1.y + (J2.y - J1.y) * t });
    }
    const len = 40, sgn = Math.sign(l.val) || 1;
    pts.forEach((pt, pi) => {
      const [sx, sy] = w2s(pt.x, pt.y);
      if (l.dir === 'y') {
        // arrow pointing toward the point, direction of force
        const tip = sy, tail = sy - sgn * len; // val<0 (down): tail above, arrow down
        line(sx, tail, sx, tip - sgn * 3);
        ctx.beginPath(); ctx.moveTo(sx, tip); ctx.lineTo(sx - 5, tip - sgn * 10); ctx.lineTo(sx + 5, tip - sgn * 10); ctx.fill();
      } else {
        const tip = sx, tail = sx - sgn * len;
        line(tail, sy, tip - sgn * 3, sy);
        ctx.beginPath(); ctx.moveTo(tip, sy); ctx.lineTo(tip - sgn * 10, sy - 5); ctx.lineTo(tip - sgn * 10, sy + 5); ctx.fill();
      }
      if (pi === 0) {
        ctx.font = '12px monospace';
        ctx.fillText(`${l.val} ${l.type === 'line' ? 'kN/m' : 'kN'} ${l.dir.toUpperCase()}`, sx + 8, sy - (l.dir === 'y' ? sgn * len : 0) - 6);
      }
    });
  }
  // joints
  for (let i = 0; i < p.joints.length; i++) {
    const [sx, sy] = w2s(p.joints[i].x, p.joints[i].y);
    ctx.fillStyle = '#ffff00';
    ctx.beginPath(); ctx.arc(sx, sy, 3.5, 0, 6.284); ctx.fill();
    ctx.fillStyle = '#cccc66'; ctx.font = '11px monospace';
    ctx.fillText(String(i + 1), sx + 5, sy - 5);
  }
  // monitors
  for (let i = 0; i < (p.monitors || []).length; i++) {
    const m = p.monitors[i];
    const [sx, sy] = w2s(m.x, m.y);
    const col = MON_COLORS[i % MON_COLORS.length];
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 6.284); ctx.stroke();
    line(sx - 11, sy, sx + 11, sy); line(sx, sy - 11, sx, sy + 11);
    ctx.font = '12px monospace'; ctx.fillText(m.name, sx + 12, sy - 10);
  }
  const bb = bbox();
  hudText(`MODEL — ${p.joints.length} joints, ${p.macros.length} macro(s), ${p.bars.length} bar(s), ${(p.supports || []).length} support(s), ${(p.loads || []).length} load(s)   [${bb.w.toFixed(0)} × ${bb.h.toFixed(0)} mm]`);
}

// ------------------- results drawing -------------------
function drawResults() {
  const model = App.model, res = App.results[App.view.step], v = App.view, p = App.params;
  const bb = bbox();
  let sc = 0;
  if (v.defScale === 'auto') {
    const target = 0.12 * Math.max(bb.w, bb.h);
    sc = res.maxDefl > 1e-9 ? target / res.maxDefl : 0;
  } else sc = parseFloat(v.defScale) || 0;

  const q = v.quantity;
  let vals = null, title = '', isNodal = false, isBar2 = false, isSlip = false;
  if (q === 'uy') { isNodal = true; title = 'Deflection u_y [mm]'; }
  else if (q === 'ux') { isNodal = true; title = 'Displacement u_x [mm]'; }
  else if (q === 'steel') { isBar2 = true; title = 'Steel stress [MPa]'; }
  else if (q === 'slip') { isSlip = true; title = 'Bond slip [mm]'; }
  else {
    const names = { sxx: 'σxx [MPa]', syy: 'σyy [MPa]', sxy: 'τxy [MPa]', s1: 'σ1 [MPa]', s2: 'σ2 [MPa]', exx: 'εxx [‰]', e1: 'ε1 [‰]', dmg: 'Damage [-]', cw: 'Crack width [mm]' };
    title = names[q]; vals = res.el[q];
  }
  let vmin = Infinity, vmax = -Infinity;
  const nodal = new Float64Array(model.nNodes);
  if (isNodal) {
    for (let n = 0; n < model.nNodes; n++) {
      nodal[n] = q === 'uy' ? res.u[2 * n + 1] : res.u[2 * n];
      if (!model.isBar[n]) { vmin = Math.min(vmin, nodal[n]); vmax = Math.max(vmax, nodal[n]); }
    }
  } else if (isBar2) { for (const b2 of res.bars) { vmin = Math.min(vmin, b2.sig); vmax = Math.max(vmax, b2.sig); } }
  else if (isSlip) { for (const s of res.springs) { vmin = Math.min(vmin, s.slip); vmax = Math.max(vmax, s.slip); } }
  else { for (const x of vals) { vmin = Math.min(vmin, x); vmax = Math.max(vmax, x); } }
  if (vmax - vmin < 1e-12) vmax = vmin + 1e-12;
  const scale1000 = (q === 'exx' || q === 'e1');

  for (let e = 0; e < model.quads.length; e++) {
    const qd = model.quads[e];
    let t;
    if (isNodal) { let s = 0; for (const n of qd) s += nodal[n]; t = (s / 4 - vmin) / (vmax - vmin); }
    else if (isBar2 || isSlip) t = null;
    else t = (vals[e] - vmin) / (vmax - vmin);
    const pts = qd.map(n => { const [x, y] = nodeXY(model, n, res.u, sc); return w2s(x, y); });
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = t === null ? '#20242a' : cmap(t);
    ctx.fill();
    if (v.showMesh) { ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 0.5; ctx.stroke(); }
  }
  if (v.showCracks) {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.4;
    for (let e = 0; e < model.quads.length; e++) {
      if (!res.el.cracked[e]) continue;
      const qd = model.quads[e];
      let cx = 0, cy = 0;
      for (const n of qd) { const [x, y] = nodeXY(model, n, res.u, sc); cx += x / 4; cy += y / 4; }
      const ang = res.el.ang[e] + Math.PI / 2;
      const r = 0.36 * Math.min(model.dx, model.dy) * (0.4 + 0.6 * Math.min(1, res.el.dmg[e] / 0.9));
      const [a, b2] = w2s(cx - r * Math.cos(ang), cy - r * Math.sin(ang));
      const [c, d] = w2s(cx + r * Math.cos(ang), cy + r * Math.sin(ang));
      line(a, b2, c, d);
    }
    ctx.strokeStyle = '#ff2020'; ctx.lineWidth = 1.6;
    for (let e = 0; e < model.quads.length; e++) {
      if (!res.el.crushed[e]) continue;
      const qd = model.quads[e];
      let cx = 0, cy = 0;
      for (const n of qd) { const [x, y] = nodeXY(model, n, res.u, sc); cx += x / 4; cy += y / 4; }
      const r = 0.28 * Math.min(model.dx, model.dy);
      let [a, b2] = w2s(cx - r, cy - r), [c, d] = w2s(cx + r, cy + r);
      line(a, b2, c, d);
      [a, b2] = w2s(cx - r, cy + r); [c, d] = w2s(cx + r, cy - r);
      line(a, b2, c, d);
    }
  }
  if (v.showRebar || isBar2 || isSlip) {
    for (let ib = 0; ib < model.bars.length; ib++) {
      const bel = model.bars[ib];
      const [x1, y1] = nodeXY(model, bel.n1, res.u, sc);
      const [x2, y2] = nodeXY(model, bel.n2, res.u, sc);
      const [a, b2] = w2s(x1, y1), [c, d] = w2s(x2, y2);
      if (res.bars[ib].ruptured) { ctx.strokeStyle = '#777'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]); }
      else if (isBar2) { const t = (res.bars[ib].sig - vmin) / (vmax - vmin); ctx.strokeStyle = cmap(t); ctx.lineWidth = 5; }
      else if (res.bars[ib].yielded) { ctx.strokeStyle = '#ff9900'; ctx.lineWidth = 3.5; }
      else { ctx.strokeStyle = '#ff5555'; ctx.lineWidth = 2.5; }
      line(a, b2, c, d);
      ctx.setLineDash([]);
    }
    if (isSlip) {
      for (let is2 = 0; is2 < model.springs.length; is2++) {
        const s = model.springs[is2];
        const [x, y] = nodeXY(model, s.nb, res.u, sc);
        const [a, b2] = w2s(x, y);
        const t = (res.springs[is2].slip - vmin) / (vmax - vmin);
        ctx.fillStyle = cmap(t);
        ctx.beginPath(); ctx.arc(a, b2, 4, 0, 6.284); ctx.fill();
      }
    }
  }
  drawLegend(title, scale1000 ? vmin * 1000 : vmin, scale1000 ? vmax * 1000 : vmax);
  hudText(`RESULTS — step ${res.step} (λ=${res.lambda.toFixed(2)})  ${title}   def.scale ${sc.toFixed(1)}×   max defl ${res.maxDefl.toFixed(3)} mm${res.failed ? '   ■ FAILED: ' + res.failureMode : ''}`);
}
function drawLegend(title, vmin, vmax) {
  const W = cv.width;
  const x = W - 66, y0 = 46, h = Math.min(300, cv.height - 110), w = 18;
  for (let i = 0; i < h; i++) { ctx.fillStyle = cmap(1 - i / h); ctx.fillRect(x, y0 + i, w, 1.5); }
  ctx.strokeStyle = '#888'; ctx.strokeRect(x, y0, w, h);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
  const n = 6;
  for (let i = 0; i <= n; i++) {
    const v = vmax - (vmax - vmin) * i / n;
    ctx.fillText(fmt(v), x - 52, y0 + h * i / n + 4);
  }
  ctx.font = '12px monospace'; ctx.fillText(title, x - 60, y0 - 12);
}
function fmt(v) {
  const a = Math.abs(v);
  if (a >= 1000) return v.toFixed(0);
  if (a >= 10) return v.toFixed(1);
  if (a >= 0.01) return v.toFixed(3);
  if (a === 0) return '0';
  return v.toExponential(1);
}

// ------------------- monitors & chart -------------------
function nearestNode(x, y) {
  const m = App.model; let best = 0, bd = Infinity;
  for (let n = 0; n < m.nNodes; n++) {
    if (m.isBar[n]) continue;
    const d = (m.X[n] - x) ** 2 + (m.Y[n] - y) ** 2;
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
function totalLoadkN(lambda) {
  const p = App.params;
  let tot = 0;
  for (const l of (p.loads || [])) {
    if (l.type === 'joint') tot += Math.abs(l.val);
    else {
      const J1 = p.joints[l.a], J2 = p.joints[l.b];
      if (J1 && J2) tot += Math.abs(l.val) * Math.hypot(J2.x - J1.x, J2.y - J1.y) / 1000;
    }
  }
  return lambda * tot;
}
function getMonitorData() {
  const p = App.params, res = App.results;
  const loads = [0].concat(res.map(r => totalLoadkN(r.lambda)));
  const mons = (p.monitors || []).map(m => {
    const n = nearestNode(m.x, m.y);
    const series = [0].concat(res.map(r => m.dir === 'uy' ? -r.u[2 * n + 1] : r.u[2 * n]));
    return { name: m.name, dir: m.dir, nx: App.model.X[n], ny: App.model.Y[n], series };
  });
  return { loads, mons };
}
function exportMonitorCSV() {
  const d = getMonitorData();
  let csv = 'load_kN' + d.mons.map(m => ',' + m.name.replace(/,/g, ' ') + '_' + m.dir + '_mm').join('') + '\n';
  for (let i = 0; i < d.loads.length; i++)
    csv += d.loads[i].toFixed(4) + d.mons.map(m => ',' + m.series[i].toFixed(6)).join('') + '\n';
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (App.params.title || 'model') + '_load_deflection.csv'; a.click();
  logMsg('Load–deflection curve exported to CSV.', 'log-ok');
}
const MON_COLORS = ['#00e5ff', '#ffd000', '#ff5db1', '#7dff6d', '#c39bff', '#ff9c40'];
function drawChart() {
  const W = cv.width, Hc = cv.height;
  const d = getMonitorData();
  if (!d.mons.length) {
    ctx.fillStyle = '#ccc'; ctx.font = '14px monospace';
    ctx.fillText('No monitoring points defined (Run ▸ Monitoring points).', 30, 50);
    return;
  }
  const mL = 90, mR = 40, mT = 55, mB = 60;
  const pw = W - mL - mR, ph = Hc - mT - mB;
  ctx.fillStyle = '#0c0f14'; ctx.fillRect(mL, mT, pw, ph);
  let xmax = 0, ymax = 0;
  for (const m of d.mons) for (const v of m.series) xmax = Math.max(xmax, Math.abs(v));
  ymax = Math.max(...d.loads);
  if (xmax < 1e-9) xmax = 1;
  if (ymax < 1e-9) ymax = 1;
  xmax *= 1.06; ymax *= 1.08;
  const px = v => mL + Math.abs(v) / xmax * pw;
  const py = v => mT + ph - v / ymax * ph;
  ctx.strokeStyle = '#2a3442'; ctx.fillStyle = '#aab'; ctx.font = '11px monospace'; ctx.lineWidth = 1;
  const nt = 8;
  for (let i = 0; i <= nt; i++) {
    const gx = mL + pw * i / nt, gy = mT + ph * i / nt;
    line(gx, mT, gx, mT + ph);
    line(mL, gy, mL + pw, gy);
    ctx.fillText(fmt(xmax * i / nt), gx - 12, mT + ph + 16);
    ctx.fillText(fmt(ymax * (1 - i / nt)), mL - 55, gy + 4);
  }
  ctx.strokeStyle = '#8899aa'; ctx.lineWidth = 1.4; ctx.strokeRect(mL, mT, pw, ph);
  ctx.fillStyle = '#ddd'; ctx.font = '13px monospace';
  ctx.fillText('Displacement [mm]', mL + pw / 2 - 60, Hc - 18);
  ctx.save(); ctx.translate(22, mT + ph / 2 + 60); ctx.rotate(-Math.PI / 2);
  ctx.fillText('Total load [kN]', 0, 0); ctx.restore();
  ctx.fillText('LOAD–DEFLECTION DIAGRAM — ' + App.params.title, mL, 30);
  d.mons.forEach((m, im) => {
    const col = MON_COLORS[im % MON_COLORS.length];
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < m.series.length; i++) {
      const X = px(m.series[i]), Y = py(d.loads[i]);
      if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.stroke();
    for (let i = 0; i < m.series.length; i++) { ctx.beginPath(); ctx.arc(px(m.series[i]), py(d.loads[i]), 3, 0, 6.284); ctx.fill(); }
    ctx.fillText(`⊕ ${m.name} (${m.dir}) @ (${m.nx.toFixed(0)}, ${m.ny.toFixed(0)})`, mL + pw - 240, mT + 18 + im * 17);
  });
}

// ------------------- canvas interaction / chrome -------------------
function setupCanvas() {
  cv = $('cv'); ctx = cv.getContext('2d');
  const resize = () => {
    const r = $('canvas-wrap').getBoundingClientRect();
    cv.width = Math.max(200, r.width - 4); cv.height = Math.max(150, r.height - 30);
    fit(); draw();
  };
  window.addEventListener('resize', resize);
  setTimeout(resize, 0);
  let drag = null;
  cv.addEventListener('mousedown', e => { drag = { x: e.offsetX, y: e.offsetY }; });
  window.addEventListener('mouseup', () => drag = null);
  cv.addEventListener('mousemove', e => {
    if (drag) {
      App.cam.ox += e.offsetX - drag.x; App.cam.oy += e.offsetY - drag.y;
      drag = { x: e.offsetX, y: e.offsetY }; draw();
    }
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    App.cam.ox = e.offsetX - (e.offsetX - App.cam.ox) * f;
    App.cam.oy = e.offsetY - (e.offsetY - App.cam.oy) * f;
    App.cam.scale *= f;
    draw();
  }, { passive: false });
}
function setupChrome() {
  $('tb-fit').onclick = () => { fit(); draw(); };
  $('tb-zin').onclick = () => { App.cam.scale *= 1.25; draw(); };
  $('tb-zout').onclick = () => { App.cam.scale /= 1.25; draw(); };
  $('tb-run').onclick = () => { selectItem('check'); runNow(); };
  $('tb-model').onclick = () => { App.view.mode = 'model'; draw(); };
  $('tb-res').onclick = () => { if (App.results) { App.view.mode = 'results'; selectItem('results'); } else logMsg('No results yet — run the analysis first.', 'log-err'); };
  $('tb-new').onclick = () => { if (confirm('Reset model to defaults?')) location.reload(); };
  $('tb-save').onclick = () => {
    const blob = new Blob([JSON.stringify(App.params, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (App.params.title || 'model') + '.rcfea.json'; a.click();
  };
  $('tb-open').onclick = () => $('file-open').click();
  $('file-open').addEventListener('change', ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const pp = JSON.parse(rd.result);
        if (!pp.joints || !pp.macros) throw new Error('Not a topology-format model file (v2).');
        App.params = pp;
        App.params.monitors = App.params.monitors || [];
        App.results = null; buildTree(); selectItem('geometry-joints'); fit(); draw();
        logMsg('Model loaded: ' + f.name, 'log-ok');
      } catch (e) { logMsg('Cannot read file: ' + e.message, 'log-err'); }
    };
    rd.readAsText(f);
  });
  document.querySelectorAll('.menu-item').forEach(m => {
    m.onclick = () => {
      const a = m.dataset.act;
      if (a === 'about') alert('RC-FEA 2D v2 — nonlinear plane-stress FEA of reinforced concrete with general topology.\n\nJoints → Lines → Macro-elements (materials) → Bars → Supports/Loads on any joints or lines.\nConcrete: Q4 + damage (Gf tension softening, parabola+softening compression, crushing at εcu).\nRebar: truss, bilinear + rupture at εu. Bond: full fib MC2010 τ–s law.\nSolver: banded LDLᵀ, total-secant iteration, failure detection.\n\nUnits mm / N / MPa / kN. Educational-research tool — verify against benchmarks before design use.');
      if (a === 'run') { selectItem('check'); runNow(); }
      if (a === 'new') $('tb-new').onclick();
      if (a === 'save') $('tb-save').onclick();
      if (a === 'open') $('tb-open').onclick();
    };
  });
}
function updateStatus() {
  const p = App.params, bb = bbox();
  $('statusbar').textContent = `${p.title}  |  ${bb.w.toFixed(0)} × ${bb.h.toFixed(0)} mm  |  h=${p.meshSize} mm  |  ${p.run.linear ? 'linear' : 'nonlinear, ' + p.run.steps + ' steps'}`;
}

// ------------------- boot -------------------
window.addEventListener('DOMContentLoaded', () => {
  buildTree(); setupCanvas(); setupChrome();
  selectItem('geometry-joints'); updateStatus();
  logMsg('RC-FEA 2D v2 ready. Topology: Joints → Lines → Macro-elements → Bars → Supports/Loads → Run ▶.', 'log-h');
});

</script>
</body>
